# Tag-driven release. Pushing an annotated tag (e.g. v2.1.0) rebuilds the
# release from a clean export of that tag, verifies that the committed
# RELEASE_MANIFEST.json matches that export and that the package version equals
# the tag, then opens a DRAFT release whose digest block is computed by CI.
#
# The workflow never publishes. A human reviews the draft and publishes it.
# This exists because hand-written release notes drifted from main in 2.0.1.
name: OAB v2 Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Export the tagged tree
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/tree"

      - name: Build manifest for the exported tree
        run: |
          python tools/release_manifest.py \
            --root "$RUNNER_TEMP/tree" \
            --output "$RUNNER_TEMP/exported-manifest.json"

      # Tag name is read from an env var rather than interpolated into the
      # shell, so a crafted ref cannot inject commands.
      - name: Guard manifest freshness and version/tag agreement
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python tools/release_guard.py \
            --tag "$TAG_NAME" \
            --exported-manifest "$RUNNER_TEMP/exported-manifest.json" \
            --committed-manifest RELEASE_MANIFEST.json

      - name: Run full test suite
        run: python -m unittest discover -s tests

      - name: Build wheel from the clean export
        run: |
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/dist" "$RUNNER_TEMP/tree"
          ls -la "$RUNNER_TEMP/dist"

      - name: Compose verified release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python tools/release_notes.py \
            --tag "$TAG_NAME" \
            --dist-dir "$RUNNER_TEMP/dist" \
            --manifest "$RUNNER_TEMP/exported-manifest.json" \
            --changelog CHANGELOG.md \
            --commit "$COMMIT_SHA" \
            --output "$RUNNER_TEMP/notes.md"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" "$RUNNER_TEMP"/dist/*.whl \
            --draft \
            --title "$TAG_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "Draft release created. Review the digests, then publish manually."
