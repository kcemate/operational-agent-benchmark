name: OAB v2 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-linux-bubblewrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and Bubblewrap
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp2
      - name: Enable Bubblewrap user namespaces on the ephemeral runner
        run: |
          if sudo sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true
      - name: Regenerate frozen fixtures
        run: |
          python tools/generate_fixtures.py
          git diff --exit-code -- cases.json fixtures/
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Run non-scoring harness calibration
        run: |
          base="$(mktemp -d)"
          python tools/run_calibration.py --output-root "$base/calibration"
      - name: Run offline qualification acceptance gate
        run: python tools/qualification_acceptance.py --json
      - name: Scan public tree
        run: |
          printf 'OAB_PRIVATE_RELEASE_%s\n' 'CANARY_DO_NOT_COMMIT' > "$RUNNER_TEMP/oab-public-denylist.txt"
          python -m oab.public_scan . --denylist "$RUNNER_TEMP/oab-public-denylist.txt"
      - name: Verify release manifest
        run: python tools/release_manifest.py --verify RELEASE_MANIFEST.json

  test-macos-sandbox-exec:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Regenerate frozen fixtures
        run: |
          python tools/generate_fixtures.py
          git diff --exit-code -- cases.json fixtures/
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Run non-scoring harness calibration
        run: |
          base="$(mktemp -d)"
          python tools/run_calibration.py --output-root "$base/calibration"
      - name: Run offline qualification acceptance gate
        run: python tools/qualification_acceptance.py --json
      - name: Verify release manifest
        run: python tools/release_manifest.py --verify RELEASE_MANIFEST.json
